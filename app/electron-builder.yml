appId: com.zzwork.app
productName: zzwork
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/node-pty/**"
npmRebuild: false
buildDependenciesFromSource: false
compression: maximum
publish:
  provider: github
  owner: zuozuoxyz
  repo: zzwork
  releaseType: release
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
    - zip
nsis:
  artifactName: zzwork-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: zzwork-${version}-portable.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  identity: null
  artifactName: zzwork-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
